# =====================================================================
# vox_server.yaml
# VoxCPM API 服务器专用「服务 + 模型 + 推理」配置文件
#
# 使用方式：
#   - 本文件为服务器全部可调参数的主要来源（代码会读取此处）。
#   - 修改后【重启服务】生效。
#   - 命令行参数 --host / --port / --device / --model / --max-workers /
#     --gpu-concurrency / --optimize / --no-optimize 可临时覆盖本文件对应项，
#     不传则一律以本文件为准。
#   - 文件缺失时服务器自动使用内置默认值（与下方一致），不会报错。
#
# 网络/安全提示：port 为本地监听端口；host 设为 0.0.0.0 会对外暴露，
# 内网/单机使用即可。
# =====================================================================


# ---------------------------------------------------------------------
# server：服务进程与并发相关
# ---------------------------------------------------------------------
server:
  # 监听地址。0.0.0.0 = 接受任意网卡连接（对外/局域网可用）；
  # 127.0.0.1 = 仅本机访问（更安全）。
  host: 0.0.0.0

  # 监听端口。与其它 TTS 服务（confucius4/index25 等）保持不同即可。
  port: 8854

  # 计算设备。建议保持 "cuda"（VoxCPM 为 GPU 推理模型）。
  # 可填："cuda" / "cuda:0" / "cpu" / "mps"；填 null 则自动选择（优先 cuda）。
  device: "cuda"

  # 线程池最大工作线程数（每个请求占一个线程，用于异步处理 / 批量并发）。
  # VoxCPM 内部已有 GPU 并发信号量（见 gpu_concurrency）保护 GPU 推理，
  # 因此本值可略大于 1 以提升 CPU 侧（特征/ASR/后处理）吞吐。
  # 一般 2~4 即可，过大无收益；默认 4 = 让 GPU 在任务切换间隙不空转（下条任务的预处理/ASR 已就绪）。
  max_workers: 4

  # GPU 并发推理数量（同时执行的 GPU 推理任务上限）。
  # 等价于 index25 的 max_concurrency：用 threading.Semaphore 串行化 GPU 推理，
  # 避免多任务争抢同一张卡导致变慢 / 显存叠加 OOM。
  # 默认 1 = 严格串行（推荐）；仅当你确认显存充足且模型线程安全时才调大（2~3）。
  gpu_concurrency: 1


# ---------------------------------------------------------------------
# model：模型加载相关
# ---------------------------------------------------------------------
model:
  # 模型目录（相对 LcTTSHub 根目录，或由 models_manager 解析的绝对路径）。
  model_dir: models/VoxCPM2

  # 是否启用 torch.compile 优化（加速推理）。
  # 开启后可获得单次推理加速，同等线程数下吞吐更高；首次编译会稍慢，个别环境可能不稳定。
  # 若 GPU 不支持 Triton 编译（报错 "0 active drivers"），请设为 false。
  optimize: false


# ---------------------------------------------------------------------
# lora：FDSpeech-VoxCPM2 少步数加速适配器（ModelScope: voidful/FDSpeech-VoxCPM2）
#
# 这是 VoxCPM2 的 rank32 LoRA 适配器（作用于语言模型与 DiT 的 q/k/v/o 投影），
# 用 Fréchet 距离损失在 4 步 Euler 采样下微调，使「4 步」达到甚至优于基座「10 步」
# 的清晰度（官方 Seed-TTS 英文：WER 1.41% vs 1.74%）。推理耗时大约是原来的 40%。
#
# 注意事项：
#   - 适配器只对 LM/DiT 做低秩增量，不改变音色/克隆流程，续写与参考克隆逻辑不变。
#   - 首次启动若本地无权重会自动从魔搭下载到 models/FDSpeech-VoxCPM2（约 69MB）。
#   - 运行中可不停机热开关：POST /api/v1/lora/enable?enabled=false 立即还原基座。
#   - 想更稳的咬字可把 inference_timesteps 调到 6；追求速度保持 4。
#
# 步数怎么选（本机实测 4 句中文 + SenseVoice 转写，供参考）：
#   steps=4  + LoRA：RTF≈1.84（约为基座的 50%），偶发咬字错误（如「语音合成系统」→「银河者系统」）
#   steps=6  + LoRA：RTF≈2.27（约为基座的 63%），字错率与基座 10 步基本持平 ← 默认
#   steps=10 无 LoRA：RTF≈3.63，基座原始质量
# ---------------------------------------------------------------------
lora:
  # 是否加载并启用该 LoRA 适配器。true = 启动即加速（推荐）；false = 纯基座模型。
  enabled: true

  # 适配器目录（相对 LcTTSHub 根目录）。缺失时按 MODEL_REGISTRY 自动下载。
  adapter_dir: models/FDSpeech-VoxCPM2

  # 适配器作者推荐的采样参数（CFG 2.35 + 4 步 Euler 是论文评测配置）。
  # 启用 LoRA 时这两项会覆盖上面 inference 的同名项作为接口默认值；
  # 请求里显式传 cfg_value / inference_timesteps 时仍以请求参数为准。
  # 中文实测：4 步偶有咬字错误，6 步与基座 10 步持平且仍快约 1.6 倍，故默认取 6；
  # 追求极限速度改 4（英文效果最佳），追求极致稳定改 10（此时开不开 LoRA 差别很小）。
  cfg_value: 2.35
  inference_timesteps: 6


# ---------------------------------------------------------------------
# inference：语音生成质量与核心推理参数
# （这些值作为 API 接口的【服务器默认】；调用时显式传参可临时覆盖）
# ---------------------------------------------------------------------
inference:
  # CFG 引导强度（classifier-free guidance scale）。
  # 范围 1.0–5.0。越大越贴合指令/参考，过小可能发散、过大可能咬字/爆音。
  # 声音克隆常用 2.0；声音设计（纯描述）可略高（2.5~3.0）以增强风格还原。
  cfg_value: 2.0

  # LocDiT 流匹配迭代步数（flow-matching sampling steps）。
  # 范围 1–50。步数越多音质越稳但越慢；10 为质量/速度良好平衡点，20~25 更细腻。
  inference_timesteps: 10

  # 是否启用文本规范化。true = 开启（数字/符号/繁简预处理，推荐）；false = 关闭。
  normalize: false

  # 是否对参考音频降噪增强。true = 开启（参考音质量一般时更干净）；false = 关闭。
  # 声音设计（无参考音频）模式下该参数无效。
  denoise: true


# ---------------------------------------------------------------------
# batch：透明批量推理流水线（默认关闭）
# 开启后服务自动把并发请求组装成批次，一次 generate_batch 获得近似线性吞吐加速。
# 命令行 --batch / --no-batch 可临时覆盖本节 enabled 设置；
# 其余参数命令行 --batch-size / --inbound-limit / --max-assembly-length / --batch-timeout
# 可临时覆盖对应项，不传则以本文件为准。
# ---------------------------------------------------------------------
batch:
  # 是否启用透明批量推理流水线。true = 启用（自动组装批次，调用 generate_batch）；
  # false = 关闭（每个请求走独立单条推理，默认行为）。
  enabled: false

  # 入队队列上限：同时堆积在 inbound_queue 里的外部请求数。
  # 超过此数的新请求会等待队列空位；过大会占用更多内存（每个请求持有特征张量）。
  inbound_limit: 15

  # 组装批次大小：一次 generate_batch 处理的最大条目数。
  # 过大可能爆显存（尤其克隆模式含参考音频）；3 是 16GB 显卡的均衡点。
  batch_size: 3

  # 单次组装参考/续写音频总时长上限（秒）。
  # 防止多条克隆请求（每条含 ~8s 参考音频）组装过长导致显存翻倍。
  # 克隆模式 batch_size=3 时约 3×8.6=26s，60s 足够；调大 batch_size 时需同步抬高。
  max_assembly_length: 60.0

  # 组装超时（秒）：低流量时尽快 flush 当前批次，避免请求在队列里等太久。
  # 0.05 = 50ms；高吞吐场景可适当调大以填充更大批次。
  batch_timeout: 0.05
