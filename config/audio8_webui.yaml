# =====================================================================
# audio8_webui.yaml
# Audio8_TTS Gradio WebUI 专用「服务 + 并发」配置文件
#
# 使用方式：
#   - 本文件为 WebUI 全部可调参数的主要来源（代码会读取此处）。
#   - 修改后【重启服务】生效。
#   - 命令行 --device / --dtype / --server-name / --server-port /
#     --share 可临时覆盖本文件对应项，不传则一律以本文件为准。
#   - 文件缺失时服务器自动使用内置默认值（与下方一致），不会报错。
#
# 网络/安全提示：host 设为 0.0.0.0 会对外暴露，内网/单机使用即可；
# share: true 会生成公网 Gradio 临时链接，按需开启。
# =====================================================================


# ---------------------------------------------------------------------
# server：服务进程与并发相关
# ---------------------------------------------------------------------
server:
  # 监听地址。0.0.0.0 = 接受任意网卡连接（对外/局域网可用）；
  # 127.0.0.1 = 仅本机访问（更安全）。
  host: 0.0.0.0

  # 监听端口。与其它 TTS 服务保持不同即可。
  port: 7868

  # 计算设备默认提示（界面下拉框默认项）。
  device: "auto"

  # 推理精度默认提示（界面下拉框默认项）。
  dtype: "auto"

  # 是否生成 Gradio 公网分享链接（true/false）。默认 false。
  share: false

  # Gradio 队列并发上限：同时被处理的用户请求/批量任务数量。
  # 该值控制「多少个 gen/batch_gen 能并行进入」，内部 GPU 推理仍由
  # gpu_concurrency 串行化，因此可略大于 1 让 CPU 预处理与 GPU 推理重叠。
  concurrency_limit: 2

  # GPU 并发推理数量（同时执行的 GPU 推理任务上限）。
  # 用 threading.Semaphore 串行化 GPU 推理，避免多用户/批量并发抢同一张卡
  # 导致变慢 / 显存叠加 OOM。默认 1 = 严格串行（推荐）；显存充足且确认
  # 线程安全时可调大（2~3）。
  gpu_concurrency: 1
