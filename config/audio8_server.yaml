# =====================================================================
# audio8_server.yaml
# Audio8_TTS API 服务器专用「服务 + 并发」配置文件
#
# 使用方式：
#   - 本文件为服务器全部可调参数的主要来源（代码会读取此处）。
#   - 修改后【重启服务】生效。
#   - 命令行 --host / --port / --device / --dtype / --max-workers /
#     --gpu-concurrency 可临时覆盖本文件对应项，不传则一律以本文件为准。
#   - 文件缺失时服务器自动使用内置默认值（与下方一致），不会报错。
#
# 网络/安全提示：port 为本地监听端口；host 设为 0.0.0.0 会对外暴露，
# 内网/单机使用即可。
# =====================================================================


# ---------------------------------------------------------------------
# server：服务进程与并发相关
# ---------------------------------------------------------------------
server:
  # 监听地址。0.0.0.0 = 接受任意网卡连接（对外/局域网可用）；
  # 127.0.0.1 = 仅本机访问（更安全）。
  host: 0.0.0.0

  # 监听端口。与其它 TTS 服务（vox/confucius4/index25 等）保持不同即可。
  port: 8007

  # 计算设备默认提示（实际按请求参数解析；auto = 优先 cuda）。
  device: "auto"

  # 推理精度默认提示（auto = 由 resolve_dtype 选择）。
  dtype: "auto"

  # 推理线程池最大工作线程数。每个请求占一个线程执行阻塞的 generate / ASR。
  # Audio8 内部已有 GPU 并发信号量（见 gpu_concurrency）保护 GPU 推理，
  # 因此本值可略大于 1 以提升 CPU 侧（预处理/后处理）吞吐，一般 2~4 即可。
  max_workers: 4

  # GPU 并发推理数量（同时执行的 GPU 推理任务上限）。
  # 用 threading.Semaphore 串行化 GPU 推理与 ASR，避免多任务争抢同一张卡
  # 导致变慢 / 显存叠加 OOM。默认 1 = 严格串行（推荐）；显存充足且确认
  # 线程安全时可调大（2~3）。
  gpu_concurrency: 1
