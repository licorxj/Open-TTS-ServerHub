# =====================================================================
# confucius4_server.yaml
# Confucius4-TTS API 服务器专用「推理 + 性能」配置文件
#
# 使用方式：
#   - 本文件为服务器全部可调参数的唯一来源（代码会读取此处）。
#   - 修改后【重启服务】生效（uvicorn 未开启热重载）。
#   - 命令行参数 --host / --port / --device / --max-workers 可临时覆盖本文件对应项，
#     不传则一律以本文件为准。
#   - 文件缺失时服务器自动使用内置默认值（与下方一致），不会报错。
#
# 网络/安全提示：port 为本地监听端口；host 设为 0.0.0.0 会对外暴露，内网/单机使用即可。
# =====================================================================


# ---------------------------------------------------------------------
# server：服务进程与并发相关
# ---------------------------------------------------------------------
server:
  # 监听地址。0.0.0.0 = 接受任意网卡连接（对外/局域网可用）；
  # 127.0.0.1 = 仅本机访问（更安全）。
  host: 0.0.0.0

  # 监听端口。客户端/网页调用需与此一致。与其它 TTS 服务（audio8/dots/index 等）保持不同即可。
  port: 8857

  # 计算设备。建议保持 null 让程序自动选择（优先级 cuda > mps > cpu）。
  # 需要强制指定时可填："cuda" / "cuda:0" / "cpu" / "mps"。
  # 注意：填 cpu 也可用，但速度会慢数十倍，仅用于无 GPU 环境验证。
  device: null

  # 线程池最大工作线程数（每个请求占一个线程）。
  # - 当 ref_feature_device=cpu 时推荐 2：一个线程在 GPU 上推理（T2S/S2A/BigVGAN），
  #   另一个线程同时在 CPU 上提取下一请求的特征（Wav2Vec2/CAMPPlus/mel），
  #   形成「CPU 生产 → GPU 消费」流水线，GPU 利用率显著提升。
  # - 当 ref_feature_device=cuda 时建议 1：特征提取和推理都在 GPU 上串行执行，
  #   多线程只会排队争抢 GPU，无实际并行收益。
  # - >2 对单卡无意义（GPU 锁保证同时只有 1 个 GPU 任务）。
  max_workers: 2

  # GPU 推理全局锁。true = 同一时刻仅一个任务执行 GPU 推理（T2S/S2A/BigVGAN）。
  # 作用：① 避免多个任务抢显存导致变慢/OOM；② 串行化 os.chdir，
  #      消除多线程下工作目录互相污染的隐患（原始 bug）。
  # 当 ref_feature_device=cpu + max_workers=2 时：
  #   CPU 特征提取在锁外执行（不阻塞），仅 GPU 推理阶段获取锁，
  #   从而实现「CPU 提取 / GPU 推理」的真并行。
  use_gpu_lock: true


# ---------------------------------------------------------------------
# inference：语音生成质量与核心推理参数
# （这些值同时作为 API 接口的默认值；调用时传参可临时覆盖）
# ---------------------------------------------------------------------
inference:
  # 采样温度。控制生成的随机性/多样性。
  # 范围 0.1–2.0。值越低越稳定/保守，越高越发散。
  # 语音克隆建议 0.7–1.0；过低可能让韵律呆板，过高可能出现异常音。
  temperature: 0.8

  # 核采样阈值（nucleus sampling）。只在累计概率前 top_p 的 token 中采样。
  # 范围 0.0–1.0。越小越保守（0.8 较稳）。与 top_k 同时生效，取两者交集。
  top_p: 0.8

  # Top-K 采样。仅从概率最高的 K 个 token 中采样。
  # 范围 0–100。0 表示关闭 top_k（只看 top_p）。典型 20–50。
  top_k: 30

  # 【性能优化】Beam Search 宽度（T2S 文本→语义阶段）。
  # - 官方/旧默认 = 3；本处已降为 1。
  # - beam=1 即贪心解码，比 beam=3 快约 2–3×，语音质量基本无损（克隆场景差异极小）。
  # - 若发现个别样本音质下降/吞字，可回到 2–3（代价是 T2S 阶段变慢）。
  # 范围 1–10。
  num_beams: 1

  # 重复惩罚。抑制生成中的重复循环（结巴/重复字）。
  # 范围 1.0–20.0。TTS 常用 8–12；过低易重复，过高易断裂/丢字。
  repetition_penalty: 10.0

  # 最大序列长度（语义 token 序列上限）。
  # 决定单次可生成的最长内容；超出会被分段。1520 对多数长文本足够。
  # 不宜盲目调大，过大会增加显存与计算。
  max_length: 1520

  # 【性能优化】S2A（语义→声学）扩散采样步数。
  # - 官方/旧默认 = 25；本处已降为 15。
  # - 每步一次 DiT 前向，是 S2A 主要耗时。15 步相比 25 步提速约 1.5–2.5×，音质几乎无感。
  # - 追求更高保真可上调到 20–25（更慢）；追求极限速度可降到 8–10（偶有高频噪声风险）。
  # 范围 1–100。
  n_timesteps: 15

  # CFG（分类器无关引导）强度，作用于 S2A 阶段。
  # 范围 0.0–2.0。越大越贴近参考音/提示，过小会发散。克隆常用 0.5–0.7。
  inference_cfg_rate: 0.7

  # 每段文本的最大 token 数（文本分段长度）。
  # 长文本会被切成多段分别合成，段间用 cross_fade 拼接。
  # 80 为较稳值；调大可减少分段（少切接痕迹）但单段更慢、更占显存；调小反之。
  max_text_tokens_per_segment: 80

  # 段间交叉淡入淡出时长（秒）。拼接相邻音频段以消除接缝爆音。
  # 0.1–0.5 均可；过大会吞掉句尾/句头，过小接缝可能可闻。
  cross_fade_duration: 0.3

  # 单段首尾边缘淡入淡出时长（秒）。避免段落起止处的爆音/截断感。
  edge_fade_duration: 0.1

  # 单段首尾静音填充时长（秒）。给模型留出首尾边界，减少开头/结尾被截断。
  edge_pad_duration: 0.1


# ---------------------------------------------------------------------
# optimization：性能加速开关
# ---------------------------------------------------------------------
optimization:
  # BigVGAN 声码器 CUDA 内核（抗混叠上/下采样融合核）。
  # - true = 使用 CUDA 内核实现（推理明显快于纯 PyTorch 卷积，声码器阶段可快数倍）。
  # - 已编译好的内核（现成，直接用）：
  #   Confucius4-TTS/external/bigvgan/alias_free_activation/cuda/build/anti_alias_activation_cuda.pyd
  #   activation1d.py 经 load.load() 调 cpp_extension.load(..., build_directory=.../build)，
  #   检测到 build/ 下已有 .pyd 即直接 import 复用，不重编、不联网、不依赖 nvcc（离线可用）。
  # - 编译环境（仅供 .pyd 缺失时重编）：CUDA 12.6 工具链(nvcc)+ninja，torch 为 RTX 4060 Ti 编原生 sm_89。
  # - 离线说明：此前离线「启动崩溃」的真实根因是 bigvgan 模型 config.json 写死 HF repo id
  #   (nvidia/bigvgan_v2_22khz_80band_256x) 联网下载，已由 confucius4_api_server.py 的
  #   _LOCAL_MODEL_MAP 映射到本地权重(models/index2/hf_cache/bigvgan)，与内核无关。
  #   仅当 build/ 下 .pyd 缺失/损坏导致内核 import 失败时，才临时设 false 走纯 PyTorch（较慢但稳定）。
  bigvgan_cuda_kernel: true

  # TF32 矩阵乘加速（NVIDIA Ampere 及更新架构，如 30/40 系）。
  # - true = 允许 FP32 矩阵乘走 TF32（精度略降，语音几乎无损，速度提升明显）。
  # - 非 Ampere 架构（如 20 系）此项无效，留 true 也无害。
  enable_tf32: true

  # cuDNN benchmark。
  # - true = 启动时为各卷积尺寸搜索最快算法（首请求稍慢，后续更快）。
  # 固定输入尺寸下建议 true；若输入尺寸变化剧烈可关闭。
  cudnn_benchmark: true

  # 参考音特征缓存。
  # - true = 对同一参考音频（按 路径 + 修改时间 + 大小 为键）缓存其语音特征
  #   （Wav2Vec2-BERT 语义 / CAMPPlus 风格 / 参考 mel），跳过重复的前向计算。
  # - 多请求共用同一参考音（如固定主播音色）时，可省约 10–30% 时间。
  # - 缓存上限为 32 条，自动淘汰最旧条目，不会无限占显存。
  ref_audio_cache: true

  # 参考音频特征提取设备（核心流水线优化开关）。
  # - "cpu" = Wav2Vec2-BERT / CAMPPlus / mel 计算在 CPU 上执行，不占用 GPU。
  #   配合 max_workers=2 实现「CPU 提取特征 / GPU 推理」生产者-消费者流水线：
  #   当请求 A 在 GPU 上做 T2S/S2A/BigVGAN 时，请求 B 可同时在 CPU 上提取特征，
  #   GPU 利用率从锯齿状间歇负载变为近乎持续满载，吞吐量显著提升。
  # - "cuda" = 特征提取也在 GPU 上执行（原始行为，与推理串行争抢 GPU）。
  # - CPU 特征提取比 GPU 慢约 2-3x，但不阻塞 GPU 推理，整体吞吐更高。
  ref_feature_device: cpu

  # T2S 自回归 LLM 的注意力计算后端。
  # - "sdpa" = 纯 PyTorch 缩放点积注意力（本项目实测最快、最稳，fp32 模型下推荐，默认）。
  # - "flash_attention_2" = Flash-Attn，注意力内部以 fp16 计算（输出回 fp32），
  #   可进一步降低 T2S 显存，但本项目实测 T2S 推理反而更慢，仅在显存极度紧张时启用。
  attn_backend: sdpa

  # S2A（语义→声学，DiT 扩散）权重精度。
  # - "bf16" = 单独把 S2A 转为 bfloat16（扩散模型对半精度耐受好、质量风险低；
  #   实测 S2A 提速约 1.5–2×，且把峰值显存从约 12.5GB 砍到约 6.3GB），默认。
  # - "fp32" = 保持 fp32（最稳，占显存最大）。
  # 说明：T2S 整体半精度会因 GPT2 的 LayerNorm/c_proj 出现 Half/Float 错位而崩溃，
  #       故 T2S 始终 fp32（仅注意力后端可切换）；BigVGAN 声码器恒 fp32（半精度易 NaN）。
  s2a_dtype: bf16


# ---------------------------------------------------------------------
# logging：运行日志
# ---------------------------------------------------------------------
logging:
  # 每次任务完成是否在控制台打印 RTF 速报。
  # - true = 打印一段清晰的 [RTF] 信息（RTF、音频时长、推理时间、n_timesteps、num_beams、输出路径），
  #   便于对比优化前后的实时因子（RTF 越小越快；<1 表示快于实时）。
  # - false = 仅记录到常规日志。
  print_rtf: true
