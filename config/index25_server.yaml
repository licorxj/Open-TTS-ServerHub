# =====================================================================
# index25_server.yaml
# IndexTTS-2.5 API 服务器专用「服务 + 模型 + 推理」配置文件
#
# 使用方式：
#   - 本文件为服务器全部可调参数的主要来源（代码会读取此处）。
#   - 修改后【重启服务】生效（uvicorn 未开启热重载）。
#   - 命令行参数 --host / --port / --model / --max-workers / --bf16 /
#     --use-qwen-emo / --device 可临时覆盖本文件对应项，
#     不传则一律以本文件为准。
#   - 文件缺失时服务器自动使用内置默认值（与下方一致），不会报错。
#
# 网络/安全提示：port 为本地监听端口；host 设为 0.0.0.0 会对外暴露，
# 内网/单机使用即可。
# =====================================================================


# ---------------------------------------------------------------------
# server：服务进程与并发相关
# ---------------------------------------------------------------------
server:
  # 监听地址。0.0.0.0 = 接受任意网卡连接（对外/局域网可用）；
  # 127.0.0.1 = 仅本机访问（更安全）。
  host: 0.0.0.0

  # 监听端口。客户端/网页调用需与此一致。与其它 TTS 服务（confucius4/audio8 等）保持不同即可。
  port: 8858

  # 推理设备。建议保持 null 让程序自动选择（优先级 cuda > cpu）。
  # 需要强制指定时可填："cuda" / "cuda:0" / "cpu"。
  # 注意：填 cpu 也可用，但速度会慢数十倍，仅用于无 GPU 环境验证。
  device: null

  # 线程池最大工作线程数（每个请求占一个线程）。
  # ⚠️ 重要：IndexTTS-2.5 当前【没有】像 Confucius4 那样的 GPU 全局锁
  #    与「CPU 特征卸载」流水线机制，多请求会直接争抢同一张 GPU 与模型内部状态，
  #    存在并发不安全/OOM 风险。因此默认保持 1（与历史行为一致）。
  # 仅当你已为 IndexTTS-2.5 自行加入 GPU 锁/并发保护、确认可安全并行时，
  # 才可调大到 2（单卡超过 2 无实际收益）。
  max_workers: 1

  # 推理最大并发数（同一时刻允许同时执行 model_instance.infer 的数量）。
  # - 1 = 严格串行（推荐默认）：批量请求自动排队（FIFO），同一时刻只有一个
  #   推理在跑 GPU 与共享模型实例，避免多任务抢 GPU 导致变慢 / 显存叠加 OOM /
  #   IndexTTS-2.5 的 infer 非线程安全引起的推理结果错乱或崩溃。
  # - 2~3 = 允许少量并发；仅当你确认当前环境下 infer 线程安全且显存充足时才调大，
  #   否则可能出现异常结果或崩溃。
  # 内部实现：asyncio 默认线程池接收所有并发请求（请求不阻塞在 HTTP 层），
  # 进入 execute_voice_clone 后在 model_instance.infer() 处用信号量节流。
  max_concurrency: 1


# ---------------------------------------------------------------------
# model：模型加载相关（映射原 INDEX25_* 环境变量）
# ---------------------------------------------------------------------
model:
  # 模型目录（相对 LcTTSHub 根目录，或由 models_manager 解析的绝对路径）。
  model_dir: models/index25

  # 是否使用 bf16 半精度加载/推理。true = 省显存、更快（Ampere 及以上收益明显）；
  # 老架构或遇到数值异常时可设 false 退回 fp32。
  use_bf16: true

  # 是否加载 QwenEmotion 以支持 instruct 文本指令情感控制。
  # true = 支持 emo_control_method=instruct（额外占用少量显存）；
  # false = 不加载，更省显存，但 instruct 模式会返回 400。
  use_qwen_emo: true

  # 模型推理设备（覆盖 server.device 的更细粒度控制）。一般留 null 即可。
  device: null


# ---------------------------------------------------------------------
# inference：语音生成质量与核心推理参数
# （这些值作为 API 接口的【服务器默认】；调用时显式传参可临时覆盖）
# ---------------------------------------------------------------------
inference:
  # 采样温度。控制生成的随机性/多样性。
  # 范围 0.1–2.0。值越低越稳定/保守，越高越发散。
  # 语音克隆建议 0.8–1.0；过低可能让韵律呆板，过高可能出现异常音。
  temperature: 1.0

  # 核采样阈值（nucleus sampling）。只在累计概率前 top_p 的 token 中采样。
  # 范围 0.0–1.0。越小越保守（0.9 较稳）。与 top_k 同时生效，取两者交集。
  top_p: 0.9

  # Top-K 采样。仅从概率最高的 K 个 token 中采样。
  # 范围 0–100。0 表示关闭 top_k（只看 top_p）。典型 20–50。
  top_k: 50

  # Beam Search 宽度。
  # - 1 = 贪心解码（最快）；>1 质量可能略升但明显变慢。
  # 范围 1–10。语音克隆常用 1。
  num_beams: 1

  # 重复惩罚。抑制生成中的重复循环（结巴/重复字）。
  # 范围 1.0–20.0。TTS 常用 1.2–2.0；过低易重复，过高易断裂/丢字。
  repetition_penalty: 1.2

  # 长度惩罚。影响生成序列长度倾向；1.0 为中性。
  # 范围 0.5–2.0。多数场景保持 1.0。
  length_penalty: 1.0

  # 最大 mel token 数（声学序列上限）。
  # 决定单次可生成的最长内容；超出会被分段。3000 对多数长文本足够。
  # 不宜盲目调大，过大会增加显存与计算。
  max_mel_tokens: 3000

  # 语速因子。>1 加快，<1 放慢（0.5~2.0）。
  speed: 1.0

  # 句间停顿毫秒数。拼接多句时句与句之间的静音长度。
  interval_silence: 200

  # 每段最大 token 数（文本分段长度）。
  # 长文本会被切成多段分别合成，段间拼接。120 为较稳值；
  # 调大可减少分段（少切接痕迹）但单段更慢、更占显存；调小反之。
  max_text_tokens_per_segment: 120

  # 是否采样（do_sample）。true = 按 top_p/top_k/temperature 采样（有多样性）；
  # false = 贪心/确定性生成（更稳但可能略呆板）。
  do_sample: true

  # 是否做文本归一化（数字、符号、繁简等预处理）。
  # true = 开启（推荐，避免“123”被逐字念出）；false = 关闭。
  text_normalization: true

  # 每次随机采样。 true = 同一文本每次生成声音略有不同（随机种子不固定）；
  # false = 固定（可复现）。
  use_random: false

  # 情感强度 0~1（instruct / vector 情感控制有效）。越大情感越浓。
  emotion_alpha: 1.0
